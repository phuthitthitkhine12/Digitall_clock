
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #312e81);
            color: white;
            transition: 0.3s;
            padding: 20px;
        }

        .clock {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 35px 20px;
            border-radius: 24px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .label {
            letter-spacing: 4px;
            color: #93c5fd;
            font-size: 13px;
        }

        h1 {
            font-size: clamp(32px, 8vw, 48px);
            margin: 25px 0;
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 16px;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 16px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #3b82f6;
            color: white;
            font-size: 14px;
        }

        button:active {
            transform: scale(0.97);
        }

        .light {
            background: linear-gradient(135deg, #dbeafe, #c4b5fd);
            color: #172554;
        }

        .light .clock {
            background: rgba(255, 255, 255, 0.65);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .light .label {
            color: #4338ca;
        }

        .light #date {
            color: #475569;
        }

        .footer {
            font-size: 12px;
            margin-top: 25px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="clock">
        <div class="label">MY DIGITAL CLOCK</div>

        <h1 id="time">00:00:00 AM</h1>

        <div id="date">Loading date...</div>

        <button onclick="toggleFormat()">
            12 / 24 Hour
        </button>

        <button onclick="toggleTheme()">
            Dark / Light
        </button>

        <div class="footer">
            Made with HTML, CSS and JavaScript
        </div>
    </div>

    <script>
        let use24Hour = false;

        function updateClock() {
            const now = new Date();

            const options = {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: !use24Hour
            };

            document.getElementById("time").textContent =
                now.toLocaleTimeString("en-US", options);

            const dateOptions = {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            };

            document.getElementById("date").textContent =
                now.toLocaleDateString("en-US", dateOptions);
        }

        function toggleFormat() {
            use24Hour = !use24Hour;
            updateClock();
        }

        function toggleTheme() {
            document.body.classList.toggle("light");
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
